<!-- `aria-label` repeats the visible label rather than pointing at it: this
     component renders more than once per screen, so it cannot own a fixed id
     for `aria-labelledby` without inventing an id scheme. -->
<div class="setting-choice" role="group" [attr.aria-label]="label()">
  <span class="setting-choice__label">{{ label() }}</span>
  <span class="setting-choice__hint">{{ hint() }}</span>

  <div class="setting-choice__options">
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="setting-choice__option"
        [class.setting-choice__option--selected]="isSelected(option)"
        (click)="choose(option)"
      >
        @if (option.icon) {
          <ng-icon
            class="setting-choice__option-icon"
            [name]="option.icon"
            size="var(--size-icon-xs)"
            aria-hidden="true"
          />
        }
        <!-- `data-label` repeats the label so the CSS can reserve its *bold*
             width on every option: selecting one switches the weight, and
             without the reservation the option would grow and shift its
             neighbours (06-review.md finding #5). -->
        <span class="setting-choice__option-label" [attr.data-label]="option.label">{{
          option.label
        }}</span>
        <!-- The check's slot is always in the DOM and always the same width;
             only the glyph inside it appears, for the same reason. The glyph
             itself stays conditional, so it is the selected option alone that
             carries the accessible name. -->
        <span class="setting-choice__option-check-slot">
          @if (isSelected(option)) {
            <ng-icon
              class="setting-choice__option-check"
              name="phosphorCheck"
              size="var(--size-icon-xs)"
              role="img"
              [attr.aria-label]="t('settings.selected.aria')"
            />
          }
        </span>
      </button>
    }
  </div>
</div>
