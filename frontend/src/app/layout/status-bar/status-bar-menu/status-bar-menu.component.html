<button
  type="button"
  class="status-bar-menu__trigger"
  [attr.aria-label]="triggerLabel()"
  [cdkMenuTriggerFor]="panel"
  [cdkMenuPosition]="menuPosition"
>
  <ng-content />
  <ng-icon
    class="status-bar-menu__caret"
    name="phosphorCaretDown"
    size="var(--size-icon-caret)"
    aria-hidden="true"
  />
</button>

<ng-template #panel>
  <!-- Rendered into the CDK's overlay container, i.e. outside this component's
       DOM subtree — but these nodes come from this template, so they carry the
       _ngcontent-* attribute and this component's stylesheet still applies.
       (The glyph <svg> inside does not: @ng-icons appends it with Renderer2,
       so it is styled only through inherited properties — frontend/CLAUDE.md.) -->
  <div class="status-bar-menu__panel" cdkMenu>
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="status-bar-menu__option"
        [class.status-bar-menu__option--selected]="isSelected(option)"
        cdkMenuItem
        (cdkMenuItemTriggered)="choose(option)"
      >
        @if (option.icon) {
          <ng-icon
            class="status-bar-menu__option-icon"
            [name]="option.icon"
            size="var(--size-icon-xs)"
            aria-hidden="true"
          />
        }
        <span class="status-bar-menu__option-label">{{ option.label }}</span>
        @if (isSelected(option)) {
          <!-- The selected row is marked twice, by a background AND a glyph:
               never colour alone (02-design.md §8.4). The glyph carries the
               accessible name, so the state is announced, not just seen. -->
          <ng-icon
            class="status-bar-menu__option-check"
            name="phosphorCheck"
            size="var(--size-icon-xs)"
            role="img"
            [attr.aria-label]="t('settings.selected.aria')"
          />
        }
      </button>
    }
  </div>
</ng-template>
