# Guest Experience Platform - backend configuration
# Feature: backend-foundation. Property names verified against Quarkus 3.33.3.1.

quarkus.application.name=gxp-backend

# --- Schema migrations (REQ-205) ---------------------------------------------
# Flyway versioned SQL is the only schema mechanism; Hibernate schema
# generation stays off ('none') in every profile (spec decision 15).
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.database.generation=none

# --- Security: fail closed (REQ-213) -----------------------------------------
# Convention (design "Security posture", enforced at review): every public
# Control method carries exactly ONE of @PermitAll / @RolesAllowed(...) - on
# the Control, never the Boundary. Roles reserved for later features:
# "admin", "device". deny-unannotated-members auto-denies unannotated members
# of any class that carries at least one security annotation.
quarkus.security.deny-unannotated-members=true

# --- Logging is a security surface (REQ-214, constitution principle 3) -------
# "Guest-sensitive data is never logged." This app will hold door and key-box
# codes, alarm codes, WiFi passwords - none of it may reach a log, in ANY
# profile including %dev. Never commit config that raises any of these:
# no SQL statement logging, no bind-parameter logging, no access/request-body
# logging, no org.hibernate DEBUG/TRACE categories.
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.bind-parameters=false
quarkus.http.access-log.enabled=false

# --- No dev-time surface in %prod (user decision 2026-08-19) -----------------
# Security is a review category (constitution); resolves backend-foundation
# 06-review finding #1. Verified against the Quarkus 3.33.3.1 artifacts:
# * /q/openapi: quarkus.smallrye-openapi.enabled is RUNTIME config (default
#   true); false makes the extension register its not-found handler -> 404.
#   Build-time model generation and the contract codegen (openapi-generator-
#   maven-plugin) are untouched; dev/test still serve the document. NOTE: the
#   similarly named `quarkus.smallrye-openapi.enable` is deprecated since
#   Quarkus 3.26 (forRemoval) - do not use it.
# * Swagger UI: dev/test-only by default (always-include defaults to false,
#   build-time). The explicit %prod guard keeps it out even if an unprofiled
#   always-include=true ever lands (the profile-specific value wins).
# * Dev Services: launch-mode-gated to dev/test in Quarkus itself; the global
#   build-time toggle exists, so the intent is pinned explicitly here.
# * Dev UI: dev-mode-only by construction (its deployment module is not even
#   on the prod build classpath); no prod-applicable property exists, so
#   nothing can - or needs to - be set.
%prod.quarkus.smallrye-openapi.enabled=false
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.devservices.enabled=false

# --- HTTP limits (backend-domain-config, REQ-316) ----------------------------
# Deliberately ABOVE the app-enforced 10 MiB asset cap: the AssetControl's own
# check must produce the 413 (with the ApiError body), not the HTTP layer.
quarkus.http.limits.max-body-size=12M

# --- Manager auth (backend-domain-config, REQ-326..REQ-331) ------------------
# Pinned production parameters live as code defaults (PBKDF2 600k iterations,
# 600 s idle, 30 s lockout). The test profile only tunes speed: fewer PBKDF2
# iterations (the stored format is self-describing, so this changes no
# behavior) and a first-start password for the seeder — %test only, never a
# production value. GXP_ADMIN_PASSWORD maps to gxp.admin.password (MP Config).
%test.gxp.admin.password=test-admin-password-1
%test.gxp.auth.pbkdf2-iterations=1000

# --- Datasource (REQ-204) ----------------------------------------------------
# dev/test: NO url on purpose - Quarkus Dev Services provisions PostgreSQL
# (Docker) for quarkus:dev and @QuarkusTest. Image pinned to the same major
# as backend/compose.yaml so tests run against what ships.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17.11

# prod: read from the environment variables backend/compose.yaml supplies.
%prod.quarkus.datasource.jdbc.url=${GXP_DB_JDBC_URL}
%prod.quarkus.datasource.username=${GXP_DB_USERNAME}
%prod.quarkus.datasource.password=${GXP_DB_PASSWORD}

# --- TLS: HTTPS only in %prod (REQ-427/428/430/433, decided 2026-08-19) ------
# The LAN is untrusted (constitution principle 4): %prod serves HTTPS ONLY -
# no plain listener, no redirect (a redirect still invites the first password
# over HTTP). Property names verified against the Quarkus 3.33.3.1 artifacts:
# * quarkus.http.insecure-requests: VertxHttpConfig.insecureRequests, enum
#   ENABLED/REDIRECT/DISABLED - `disabled` removes the plain-HTTP listener.
# * quarkus.tls.key-store.p12.{path,password}: the TLS registry's DEFAULT
#   bucket (quarkus-tls-registry TlsConfig -> TlsBucketConfig -> KeyStoreConfig
#   -> P12KeyStoreConfig); the HTTP server picks the default bucket up for
#   HTTPS. The older quarkus.http.ssl.certificate.* set still exists but the
#   registry is the current mechanism - do not mix the two.
# The three GXP_TLS_* variables are exported by the container entrypoint
# (src/main/docker/entrypoint-jvm.sh) after generating/reusing the material
# on the gxp-tls volume; a %prod boot WITHOUT them fails fast on config
# expansion (the GXP_ADMIN_PASSWORD posture), and the entrypoint itself
# refuses to start without GXP_TLS_HOST. %dev/%test stay plain HTTP - the
# same posture split as the %prod-only /q/openapi lockdown above: config
# review + the compose smoke prove the %prod half, tests prove everything
# profile-independent. The CA PEM path feeds GET /api/pairing/ca (public
# material for kiosk provisioning); in %dev/%test the file does not exist
# and the endpoint answers a clearly coded 404.
%prod.quarkus.http.insecure-requests=disabled
%prod.quarkus.tls.key-store.p12.path=${GXP_TLS_KEYSTORE_PATH}
%prod.quarkus.tls.key-store.p12.password=${GXP_TLS_KEYSTORE_PASSWORD}
%prod.gxp.tls.ca-pem-path=${GXP_TLS_CA_PEM_PATH}
