openapi: 3.1.0
info:
  title: Guest Experience Platform API
  description: >-
    Contract-first API of the Guest Experience Platform backend — one
    self-hosted instance per building. This file is the source of truth:
    the Maven build generates the JAX-RS interfaces/DTOs (never committed)
    and the TypeScript client in packages/api-client/ (committed, never
    hand-edited) from it.
  version: 1.0.0
tags:
  - name: system
    description: Box diagnosis — health, readiness and instance metadata.
  - name: manager-auth
    description: >-
      Manager session lifecycle. The shared admin password is sent to
      managerLogin ONLY; every other manager operation authenticates with the
      opaque bearer token it returns (10-minute idle expiry, sliding). Every
      authenticated response carries the refreshed expiry in the
      GXP-Token-Expires header (ISO-8601 instant) so a client can warn before
      idle-out. One interface is generated per manager-* tag so each BCE
      package keeps its own Boundary.
  - name: manager-property
    description: >-
      The single property (invariant 4 — exactly one row, no create/delete).
      Template fields (greeting, standby) are stored and returned RAW; the
      manager edits templates, not resolved text.
  - name: manager-rooms
    description: Rooms of the property, with per-room overrides.
  - name: manager-menu
    description: >-
      Menu catalogue (read-only, Flyway-seeded — deliberately no write
      operation), per-scope menu configuration (per-field inheritance room →
      property → catalogue default) and per-scope action cards (whole-set
      replace, 0–4). The structurally fixed settings entry (einstellungen) is
      NOT part of the catalogue — it is app chrome a manager must not disable.
  - name: manager-stays
    description: Stays; "active" is derived from the clock, never stored.
  - name: manager-assets
    description: >-
      Binary assets (PNG/JPEG only, content-verified, 10 MiB cap, server-side
      downscaled to 2560 px longest edge), stored in PostgreSQL.
  - name: pairing
    description: >-
      Kiosk-facing pairing surface — unauthenticated by design. A kiosk
      creates a short-lived pairing request and receives a human-readable
      display code (shown to the manager) plus a high-entropy poll secret
      (kept by the kiosk, never displayed): the display code alone never
      suffices to obtain a token, because the kiosk screen stands in a
      guest-accessible room. Also serves the instance CA certificate for
      kiosk provisioning. Second Boundary of the de.gxp.device package
      (one consistency unit spanning two auth surfaces).
  - name: manager-devices
    description: >-
      Manager-facing device administration — confirm pairing requests, list,
      rename and revoke paired kiosk devices. No operation ever returns
      token material. Shares the de.gxp.device package (and its single
      Control) with the pairing tag.
  - name: guest
    description: >-
      Kiosk-facing guest read model (device bearer token). The room is
      derived EXCLUSIVELY from the authenticated device identity — no guest
      operation accepts any room, stay, device or property identifier, in
      path, query, header or body. Localized fields are language-keyed maps
      over exactly the property's offered languages, so a kiosk language
      switch fetches nothing. Every JSON response carries a strong ETag and
      answers 304 on If-None-Match — steady-state polling is 304s.
paths:
  /api/system/health:
    get:
      tags: [system]
      operationId: getSystemHealth
      summary: Liveness — answers whenever the process serves HTTP
      description: Static response, touches no database.
      responses:
        "200":
          description: The process is up and serving HTTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
  /api/system/ready:
    get:
      tags: [system]
      operationId: getSystemReadiness
      summary: Readiness — verifies database connectivity
      responses:
        "200":
          description: The instance is ready; the database answered a probe query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReadiness"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Instance metadata
      description: >-
        Returns instance metadata; instanceName is read from PostgreSQL
        through the full BCE stack (Flyway-seeded row). Restricted to
        authenticated callers (admin or device token) — version
        fingerprinting on an unpatchable box is not offered anonymously
        (decided 2026-08-19).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/login:
    post:
      tags: [manager-auth]
      operationId: managerLogin
      summary: Log in with the shared admin password
      description: >-
        The only operation that ever sees the password. Success returns an
        opaque 256-bit bearer token with a sliding 10-minute idle expiry.
        Failure is a deliberately generic 401 (no oracle). Deliberately not
        throttled (owner decision 2026-08-24): no lockout, no rate limit, no
        concurrency gate — repeated failures accumulate no state and a correct
        password is never refused. Brute-force resistance rests on the
        password policy (minimum 8 characters).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; token is in-memory only on the client.
          headers:
            GXP-Token-Expires:
              $ref: "#/components/headers/GXPTokenExpires"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Wrong password — deliberately generic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/logout:
    post:
      tags: [manager-auth]
      operationId: managerLogout
      summary: Invalidate the presented bearer token immediately
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token dropped server-side.
        "401":
          description: Missing, unknown or expired token.
  /api/manager/password:
    put:
      tags: [manager-auth]
      operationId: changeManagerPassword
      summary: Change the shared admin password
      description: >-
        Verifies the current password, enforces the minimal policy
        (at least 8 characters), stores the new hash and immediately drops
        EVERY active bearer token — including the caller's.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed; all bearer tokens are dropped.
        "400":
          description: Current password mismatch or policy violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/property:
    get:
      tags: [manager-property]
      operationId: getProperty
      summary: Read the single property (settings options and raw templates included)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDto"
        "401":
          description: Missing, unknown or expired token.
    put:
      tags: [manager-property]
      operationId: updateProperty
      summary: Replace the single property
      description: >-
        Validates the IANA timezone, hex brand colors, defaults contained in
        their offered sets, language codes (de/en in v1), referenced asset
        kinds and every template field against its allowed placeholder set.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyDto"
      responses:
        "200":
          description: The stored property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDto"
        "400":
          description: Validation failure (timezone, colors, options, templates).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/rooms:
    get:
      tags: [manager-rooms]
      operationId: listRooms
      summary: List rooms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomDto"
        "401":
          description: Missing, unknown or expired token.
    post:
      tags: [manager-rooms]
      operationId: createRoom
      summary: Create a room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomDto"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDto"
        "400":
          description: Validation failure (empty code, override not offered).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: Room code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/rooms/{roomId}:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [manager-rooms]
      operationId: getRoom
      summary: Read one room
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDto"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [manager-rooms]
      operationId: updateRoom
      summary: Replace one room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomDto"
      responses:
        "200":
          description: The stored room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDto"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Room code already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [manager-rooms]
      operationId: deleteRoom
      summary: Delete a room (cascades its own config overrides)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted; the room's own menu/card overrides went with it.
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The room still has stays — they are named, never destroyed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/menu/catalogue:
    get:
      tags: [manager-menu]
      operationId: getMenuCatalogue
      summary: Read the release menu catalogue (read-only)
      description: >-
        Seeded by Flyway, writable through no API. Covers exactly the real
        kiosk sections of this release.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The catalogue definitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemDefinitionDto"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/menu-config:
    get:
      tags: [manager-menu]
      operationId: getMenuConfig
      summary: Read the property-scope menu override entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The property scope's override entries (absent fields inherit).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemConfigEntryDto"
        "401":
          description: Missing, unknown or expired token.
    put:
      tags: [manager-menu]
      operationId: updateMenuConfig
      summary: Replace the property-scope menu override entries atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MenuItemConfigEntryDto"
      responses:
        "200":
          description: The stored override entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemConfigEntryDto"
        "400":
          description: Unknown menu item key or duplicate entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: >-
            Disabling would strand action cards (invariant 3) — every
            offending card and its scope is listed in details; nothing is
            silently dropped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/rooms/{roomId}/menu-config:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [manager-menu]
      operationId: getRoomMenuConfig
      summary: Read a room scope's menu override entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The room scope's override entries (absent fields inherit).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemConfigEntryDto"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [manager-menu]
      operationId: updateRoomMenuConfig
      summary: Replace a room scope's menu override entries atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/MenuItemConfigEntryDto"
      responses:
        "200":
          description: The stored override entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItemConfigEntryDto"
        "400":
          description: Unknown menu item key or duplicate entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Disabling would strand action cards (invariant 3).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/action-cards:
    get:
      tags: [manager-menu]
      operationId: getActionCards
      summary: Read the property-scope action cards
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The property scope's cards (0–4, sorted).
          content:
            application/json:
              schema:
                type: array
                maxItems: 4
                items:
                  $ref: "#/components/schemas/ActionCardDto"
        "401":
          description: Missing, unknown or expired token.
    put:
      tags: [manager-menu]
      operationId: updateActionCards
      summary: Replace the property-scope card set wholesale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 4
              items:
                $ref: "#/components/schemas/ActionCardDto"
      responses:
        "200":
          description: The stored card set.
          content:
            application/json:
              schema:
                type: array
                maxItems: 4
                items:
                  $ref: "#/components/schemas/ActionCardDto"
        "400":
          description: >-
            Invariant 1 (more than 4 cards / duplicate sortIndex), unknown
            target key, or invalid template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: A target is disabled in this scope (invariant 2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/rooms/{roomId}/action-cards:
    parameters:
      - $ref: "#/components/parameters/RoomId"
    get:
      tags: [manager-menu]
      operationId: getRoomActionCards
      summary: Read a room scope's own action cards
      description: >-
        Returns the room's OWN card rows (possibly empty). A room with at
        least one card replaces the property set wholesale on the kiosk.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The room scope's own cards (0–4, sorted).
          content:
            application/json:
              schema:
                type: array
                maxItems: 4
                items:
                  $ref: "#/components/schemas/ActionCardDto"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [manager-menu]
      operationId: updateRoomActionCards
      summary: Replace a room scope's card set wholesale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 4
              items:
                $ref: "#/components/schemas/ActionCardDto"
      responses:
        "200":
          description: The stored card set.
          content:
            application/json:
              schema:
                type: array
                maxItems: 4
                items:
                  $ref: "#/components/schemas/ActionCardDto"
        "400":
          description: Invariant 1, unknown target key, or invalid template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A target is disabled in this scope (invariant 2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/stays:
    get:
      tags: [manager-stays]
      operationId: listStays
      summary: List stays, optionally filtered by room
      security:
        - bearerAuth: []
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Stays (all, or the room's).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StayDto"
        "401":
          description: Missing, unknown or expired token.
    post:
      tags: [manager-stays]
      operationId: createStay
      summary: Create a stay
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StayDto"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayDto"
        "400":
          description: >-
            Validation failure (checkIn not before checkOut, override not in
            the property's offered set, unknown room).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: Overlaps a non-cancelled stay of the room — named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/stays/{stayId}:
    parameters:
      - name: stayId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [manager-stays]
      operationId: getStay
      summary: Read one stay
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayDto"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [manager-stays]
      operationId: updateStay
      summary: Replace one stay
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StayDto"
      responses:
        "200":
          description: The stored stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayDto"
        "400":
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Overlaps a non-cancelled stay of the room — named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [manager-stays]
      operationId: deleteStay
      summary: Delete a stay
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such stay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/assets:
    get:
      tags: [manager-assets]
      operationId: listAssets
      summary: List asset metadata (payload-free)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metadata of every stored asset — the payload column is never read.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetMetadataDto"
        "401":
          description: Missing, unknown or expired token.
    post:
      tags: [manager-assets]
      operationId: uploadAsset
      summary: Upload an image as a raw binary body (no multipart)
      description: >-
        PNG or JPEG only; the declared content type must match the decoded
        format. Images over 2560 px longest edge are downscaled server-side;
        sha256/size/dimensions describe the STORED bytes.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored; metadata reflects the stored (possibly downscaled) bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetMetadataDto"
        "400":
          description: Undecodable body or declared type does not match the content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "413":
          description: Larger than the 10 MiB cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [manager-assets]
      operationId: getAssetBinary
      summary: Read the binary (strong ETag, 304 on If-None-Match)
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The stored bytes.
          headers:
            ETag:
              description: Strong ETag — the SHA-256 of the stored bytes.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: If-None-Match matched the stored SHA-256.
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [manager-assets]
      operationId: deleteAsset
      summary: Delete an asset
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted.
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Referenced by the property or a room — the referrer is named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pairing/requests:
    post:
      tags: [pairing]
      operationId: createPairingRequest
      summary: Create a short-lived pairing request (kiosk, unauthenticated)
      description: >-
        Returns the display code the kiosk shows to the manager, the poll
        secret the kiosk keeps (never displayed), and the expiry. Expired
        requests are cleaned up opportunistically on each create.
        Deliberately not throttled (owner decision 2026-08-24): no rate limit
        and no admission gate, so there is no 429 here — the number of live
        requests is bounded only in age, by the 10-minute TTL plus that
        opportunistic cleanup, and guessing is made infeasible by the code
        entropy and TTL rather than by a budget.
      responses:
        "201":
          description: Pairing request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestCreated"
  /api/pairing/requests/{code}:
    get:
      tags: [pairing]
      operationId: pollPairingRequest
      summary: Poll a pairing request (kiosk, unauthenticated, poll secret required)
      description: >-
        202 while pending; 200 with the device token EXACTLY ONCE after the
        manager confirms — the request is atomically claimed, a second poll
        gets 404. Unknown, expired, already-claimed and wrong-secret
        requests all answer one indistinguishable 404 (no oracle).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: GXP-Pairing-Secret
          in: header
          required: true
          description: The poll secret returned at create — never displayed on the kiosk.
          schema:
            type: string
      responses:
        "200":
          description: >-
            Confirmed and claimed by THIS poll — the raw device token,
            returned exactly once and never stored raw server-side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCompleted"
        "202":
          description: Pending — the manager has not confirmed yet. Empty body.
        "404":
          description: >-
            Unknown, expired, claimed or wrong secret — deliberately
            indistinguishable (status and body identical).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pairing/ca:
    get:
      tags: [pairing]
      operationId: getPairingCa
      summary: The instance CA certificate (PEM — public material)
      description: >-
        For kiosk provisioning: a person installs this CA into the device's
        OS/browser trust store during pairing (documented in the README as a
        human step). Public material, unauthenticated.
      responses:
        "200":
          description: The CA certificate, PEM-encoded.
          content:
            application/x-pem-file:
              schema:
                type: string
        "404":
          description: No TLS material on this instance (dev/test profiles).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/pairings/{code}/confirm:
    post:
      tags: [manager-devices]
      operationId: confirmPairing
      summary: Confirm a pairing request to a room (manager)
      description: >-
        Assigns the pending request to an existing room, with an optional
        device name (default derived from the room code). The kiosk's next
        poll then claims the token.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPairingRequest"
      responses:
        "204":
          description: Confirmed.
        "400":
          description: Unknown room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: Unknown or expired pairing code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/devices:
    get:
      tags: [manager-devices]
      operationId: listDevices
      summary: List all paired devices (never any token material)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every device — room, name, created, last seen, revoked state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceDto"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/devices/{deviceId}:
    put:
      tags: [manager-devices]
      operationId: renameDevice
      summary: Rename a device
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdateRequest"
      responses:
        "200":
          description: The renamed device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDto"
        "400":
          description: Blank name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/devices/{deviceId}/revoke:
    post:
      tags: [manager-devices]
      operationId: revokeDevice
      summary: Revoke a device (soft — the token is dead on its very next request)
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Revoked (idempotent — revoking twice is still 204).
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/guest/session:
    get:
      tags: [guest]
      operationId: getGuestSession
      summary: Everything route-independent for the device's room
      description: >-
        Property (name, brand, logo), room, occupancy, settings config with
        resolved defaults (room override, else property default), the stay's
        raw preference override (occupied only), the resolved menu under the
        ceiling rule plus the fixed settings chrome, and the resolved standby
        texts. Vacant rooms serve no stay-derived value (data-sparing) but
        still answer 200 — the standby screen renders from this.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The session for the device's room.
          headers:
            ETag:
              description: Strong ETag — SHA-256 over the response bytes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSession"
        "304":
          description: If-None-Match matched — empty body.
        "401":
          description: Missing, unknown or revoked device token.
  /api/guest/screens/home:
    get:
      tags: [guest]
      operationId: getGuestHomeScreen
      summary: The home screen content for the device's room
      description: >-
        Headline/subtitle/paragraph and 0–4 action cards, all templates
        RESOLVED server-side per offered language against the active stay
        (checkout time/date in the property timezone, each language's
        locale) — no braces ever leave the server. Artwork falls back room →
        property.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The resolved home screen.
          headers:
            ETag:
              description: Strong ETag — SHA-256 over the response bytes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestHomeScreen"
        "304":
          description: If-None-Match matched — empty body.
        "401":
          description: Missing, unknown or revoked device token.
        "404":
          description: Unknown screen key, or the home item resolves disabled for this room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The room is vacant (room-vacant) — no stay-derived content is served.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/guest/assets/{assetId}:
    get:
      tags: [guest]
      operationId: getGuestAsset
      summary: Read an asset reachable from the device's own resolved view
      description: >-
        Serves ONLY the property logo, the property default artwork and the
        own room's artwork; any other id — existing or not — is the same
        404 (no enumeration of stored assets from a guest device). Asset
        content per id is immutable, so clients may cache long.
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The stored bytes.
          headers:
            ETag:
              description: Strong ETag — the SHA-256 of the stored bytes.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: If-None-Match matched the stored SHA-256.
        "401":
          description: Missing, unknown or revoked device token.
        "404":
          description: Unknown or unreachable asset — deliberately the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/guest/preferences:
    put:
      tags: [guest]
      operationId: putGuestPreferences
      summary: Write the guest's preference override (whole record, stay-anchored)
      description: >-
        Mirrors the kiosk's StoredPreferences gateway record — a whole-record
        write, both fields nullable (null = follow the defaults). Lands on
        the ACTIVE stay, so it clears at stay change by construction. The
        kiosk treats failure as normal (fire-and-forget).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPreferencesUpdate"
      responses:
        "204":
          description: Stored on the active stay.
        "400":
          description: A value is outside the property's offered set (value-not-offered).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or revoked device token.
        "409":
          description: The room is vacant (room-vacant) — there is no stay to write on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        One bearer authentication path, two token kinds. Manager tokens come
        from managerLogin (stored hashed in-memory, sliding 10-minute idle
        expiry; a restart logs everyone out). Device tokens come from the
        pairing flow (stored hashed in PostgreSQL, long-lived, no idle
        expiry, revocable — dead on the very next request after revocation).
        The token is identity AND authentication; a device's room is derived
        from it, never from a request parameter.
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  headers:
    GXPTokenExpires:
      description: >-
        Refreshed idle expiry of the presented (or issued) bearer token,
        ISO-8601 instant. Present on every authenticated response.
      schema:
        type: string
        format: date-time
  schemas:
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [token, idleTimeoutSeconds, expiresAt]
      properties:
        token:
          type: string
          description: Opaque bearer token — keep in memory only.
        idleTimeoutSeconds:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
    LanguageCode:
      type: string
      description: v1 supports exactly the kiosk's compiled catalogues.
      enum: [de, en]
    AppearanceMode:
      type: string
      enum: [light, dark, system]
    LocalizedText:
      type: object
      description: Language-keyed map (keys are LanguageCode values).
      additionalProperties:
        type: string
    LanguageOptionDto:
      type: object
      required: [code, shortLabel, label, locale]
      properties:
        code:
          $ref: "#/components/schemas/LanguageCode"
        shortLabel:
          type: string
          minLength: 1
        label:
          type: string
          description: Endonym — never translated.
          minLength: 1
        locale:
          type: string
          description: BCP-47 tag governing time/date formatting (e.g. de-DE, en-GB).
          minLength: 1
    AppearanceOptionDto:
      type: object
      required: [mode, icon]
      properties:
        mode:
          $ref: "#/components/schemas/AppearanceMode"
        icon:
          type: string
          minLength: 1
    PropertyDto:
      type: object
      required:
        - name
        - mainLanguage
        - timezone
        - brandPrimary
        - brandPrimaryDeep
        - brandSecondary
        - defaultAppearance
        - languages
        - appearances
        - heroSubtitle
        - headline
        - paragraph
        - standbyHeadline
        - standbyMessage
      properties:
        name:
          type: string
          minLength: 1
        mainLanguage:
          $ref: "#/components/schemas/LanguageCode"
        timezone:
          type: string
          description: IANA zone id — ZoneId-validated server-side.
          minLength: 1
        brandPrimary:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        brandPrimaryDeep:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        brandSecondary:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        defaultAppearance:
          $ref: "#/components/schemas/AppearanceMode"
        logoAssetId:
          type: integer
          format: int64
          description: Optional; the referenced asset must be kind LOGO.
        artworkAssetId:
          type: integer
          format: int64
          description: Optional house default; must be kind ARTWORK.
        languages:
          type: array
          description: Offered languages, in display order; must contain mainLanguage.
          minItems: 1
          items:
            $ref: "#/components/schemas/LanguageOptionDto"
        appearances:
          type: array
          description: Offered appearance options, in display order; must contain defaultAppearance.
          minItems: 1
          items:
            $ref: "#/components/schemas/AppearanceOptionDto"
        heroSubtitle:
          $ref: "#/components/schemas/LocalizedText"
        headline:
          description: Greeting template — all four placeholders allowed. Raw.
          $ref: "#/components/schemas/LocalizedText"
        paragraph:
          $ref: "#/components/schemas/LocalizedText"
        standbyHeadline:
          description: Standby template — only {property.name} (no stay when vacant). Raw.
          $ref: "#/components/schemas/LocalizedText"
        standbyMessage:
          $ref: "#/components/schemas/LocalizedText"
    StayStatus:
      type: string
      description: Stored state; "active" is derived (BOOKED and check-in ≤ now < check-out).
      enum: [BOOKED, CANCELLED]
    StayDto:
      type: object
      required: [roomId, displayName, checkIn, checkOut, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        roomId:
          type: integer
          format: int64
        displayName:
          type: string
          minLength: 1
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        language:
          $ref: "#/components/schemas/LanguageCode"
        appearance:
          $ref: "#/components/schemas/AppearanceMode"
        status:
          $ref: "#/components/schemas/StayStatus"
    AssetKind:
      type: string
      enum: [LOGO, ARTWORK]
    AssetMetadataDto:
      type: object
      required: [id, mimeType, byteSize, width, height, sha256, kind]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        mimeType:
          type: string
          enum: [image/png, image/jpeg]
        byteSize:
          type: integer
        width:
          type: integer
        height:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the stored bytes — doubles as the strong ETag.
        kind:
          $ref: "#/components/schemas/AssetKind"
    MenuItemDefinitionDto:
      type: object
      required: [key, route, defaultIcon, defaultSortIndex, label, introducedRelease]
      properties:
        key:
          type: string
        route:
          type: string
          description: Kiosk route; the home section's route is the empty string.
        defaultIcon:
          type: string
        defaultSortIndex:
          type: integer
        label:
          $ref: "#/components/schemas/LocalizedText"
        introducedRelease:
          type: string
    MenuItemConfigEntryDto:
      type: object
      description: >-
        One scope's override entry for a catalogue item. Every field except
        menuItemKey is optional — an absent field inherits per-field
        (room → property → catalogue default).
      required: [menuItemKey]
      properties:
        menuItemKey:
          type: string
        enabled:
          type: boolean
        sortIndex:
          type: integer
        iconOverride:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
    ActionCardDto:
      type: object
      required: [sortIndex, icon, targetMenuItemKey, title, description]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        sortIndex:
          type: integer
          minimum: 0
          maximum: 3
        icon:
          type: string
          minLength: 1
        targetMenuItemKey:
          type: string
          description: >-
            Must exist in the catalogue and be enabled in this card's scope.
            Deliberately not unique — several cards may target the same item.
        title:
          description: Raw title template per language.
          $ref: "#/components/schemas/LocalizedText"
        description:
          description: Raw description template per language.
          $ref: "#/components/schemas/LocalizedText"
    RoomDto:
      type: object
      required: [code, displayName]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        code:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        artworkAssetId:
          type: integer
          format: int64
          description: Optional override; must be kind ARTWORK.
        defaultLanguage:
          $ref: "#/components/schemas/LanguageCode"
        defaultAppearance:
          $ref: "#/components/schemas/AppearanceMode"
    SystemHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    SystemReadiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [READY]
    SystemInfo:
      type: object
      required: [instanceName, applicationVersion]
      properties:
        instanceName:
          type: string
        applicationVersion:
          type: string
    ApiError:
      description: >-
        Shared error shape. code is machine-usable (e.g.
        menu-item-targeted-by-cards, stay-overlap, asset-in-use,
        unknown-placeholder); details carries one entry per offending
        item where a list is needed. Extended additively only.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorDetail"
    PairingRequestCreated:
      type: object
      required: [code, pollSecret, expiresAt]
      properties:
        code:
          type: string
          description: >-
            8-char display code (unambiguous alphabet, no 0/O/1/I) — shown on
            the kiosk for the manager. Alone it never yields a token.
        pollSecret:
          type: string
          description: >-
            High-entropy poll secret — kept by the kiosk, never displayed,
            presented via the GXP-Pairing-Secret header on every poll.
            Stored hashed server-side.
        expiresAt:
          type: string
          format: date-time
    PairingCompleted:
      type: object
      required: [deviceToken, deviceName, roomCode]
      properties:
        deviceToken:
          type: string
          description: >-
            The opaque device bearer token — returned exactly once, persisted
            only as a SHA-256 hash server-side. The kiosk stores it as its
            own credential.
        deviceName:
          type: string
        roomCode:
          type: string
    ConfirmPairingRequest:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: integer
          format: int64
        deviceName:
          type: string
          minLength: 1
          description: Optional; defaults to "Kiosk <room code>".
    DeviceDto:
      type: object
      description: Never carries token material — not even the hash.
      required: [id, name, roomId, roomCode, createdAt]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        roomId:
          type: integer
          format: int64
        roomCode:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Throttled — accurate to about a minute.
        revokedAt:
          type: string
          format: date-time
    DeviceUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    OccupancyState:
      type: string
      description: Derived — BOOKED and check-in ≤ now < check-out is OCCUPIED.
      enum: [OCCUPIED, VACANT]
    GuestBrand:
      type: object
      required: [primary, primaryDeep, secondary]
      properties:
        primary:
          type: string
        primaryDeep:
          type: string
        secondary:
          type: string
    GuestProperty:
      type: object
      required: [name, brand]
      properties:
        name:
          type: string
        brand:
          $ref: "#/components/schemas/GuestBrand"
        logoAssetId:
          type: integer
          format: int64
          description: Fetch via getGuestAsset (with the device token — no bare img src).
    GuestRoom:
      type: object
      required: [code, displayName]
      properties:
        code:
          type: string
        displayName:
          type: string
    GuestSettings:
      type: object
      description: The kiosk's settingsConfig plus resolved defaults (room override, else property).
      required: [languages, appearances, defaultLanguage, defaultAppearance]
      properties:
        languages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LanguageOptionDto"
        appearances:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AppearanceOptionDto"
        defaultLanguage:
          $ref: "#/components/schemas/LanguageCode"
        defaultAppearance:
          $ref: "#/components/schemas/AppearanceMode"
    GuestPreference:
      type: object
      description: >-
        The stay's RAW preference override (default-⊕-choice model: the kiosk
        keeps its own resolution). Fields absent = no override.
      properties:
        language:
          type: string
        appearance:
          type: string
    GuestMenuItem:
      type: object
      required: [key, label, icon, route, sortIndex]
      properties:
        key:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
        route:
          type: string
        sortIndex:
          type: integer
    GuestSettingsEntry:
      type: object
      description: Fixed app chrome — NOT a catalogue item, no configuration removes it.
      required: [id, label, icon, route]
      properties:
        id:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
        route:
          type: string
    GuestMenu:
      type: object
      required: [items, settingsEntry]
      properties:
        items:
          type: array
          description: Resolved-enabled items only, ordered by resolved sort index.
          items:
            $ref: "#/components/schemas/GuestMenuItem"
        settingsEntry:
          $ref: "#/components/schemas/GuestSettingsEntry"
    GuestStandby:
      type: object
      description: Standby texts, template-resolved per offered language.
      required: [headline, message]
      properties:
        headline:
          $ref: "#/components/schemas/LocalizedText"
        message:
          $ref: "#/components/schemas/LocalizedText"
    GuestSession:
      type: object
      required: [property, room, occupancy, settings, menu, standby]
      properties:
        property:
          $ref: "#/components/schemas/GuestProperty"
        room:
          $ref: "#/components/schemas/GuestRoom"
        occupancy:
          $ref: "#/components/schemas/OccupancyState"
        guestDisplayName:
          type: string
          description: Occupied only — a vacant room serves no stay-derived value.
        settings:
          $ref: "#/components/schemas/GuestSettings"
        preference:
          $ref: "#/components/schemas/GuestPreference"
        menu:
          $ref: "#/components/schemas/GuestMenu"
        standby:
          $ref: "#/components/schemas/GuestStandby"
    GuestActionCard:
      type: object
      required: [icon, title, description, targetKey, targetRoute]
      properties:
        icon:
          type: string
        title:
          description: RESOLVED per offered language — never a raw template.
          $ref: "#/components/schemas/LocalizedText"
        description:
          description: RESOLVED per offered language — never a raw template.
          $ref: "#/components/schemas/LocalizedText"
        targetKey:
          type: string
        targetRoute:
          type: string
    GuestHomeScreen:
      type: object
      required: [headline, subtitle, paragraph, actionCards]
      properties:
        headline:
          description: RESOLVED greeting per offered language.
          $ref: "#/components/schemas/LocalizedText"
        subtitle:
          $ref: "#/components/schemas/LocalizedText"
        paragraph:
          $ref: "#/components/schemas/LocalizedText"
        artworkAssetId:
          type: integer
          format: int64
          description: Room override, else the property default; absent when neither is set.
        actionCards:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/GuestActionCard"
    GuestPreferencesUpdate:
      type: object
      description: >-
        Whole-record write mirroring the kiosk's StoredPreferences — an
        absent/null field means "follow the defaults".
      properties:
        language:
          type: string
        appearance:
          type: string
    ApiErrorDetail:
      description: One offending item of a rejected request.
      type: object
      required: [message]
      properties:
        code:
          type: string
        message:
          type: string
        scope:
          type: string
          description: Affected scope — "property" or "room:{id}".
        reference:
          type: string
          description: Machine-usable reference (card id, key, stay id, …).
