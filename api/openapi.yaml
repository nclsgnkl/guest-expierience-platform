openapi: 3.1.0
info:
  title: Guest Experience Platform API
  description: >-
    Contract-first API of the Guest Experience Platform backend — one
    self-hosted instance per building. This file is the source of truth:
    the Maven build generates the JAX-RS interfaces/DTOs (never committed)
    and the TypeScript client in packages/api-client/ (committed, never
    hand-edited) from it.
  version: 1.0.0
tags:
  - name: system
    description: Box diagnosis — health, readiness and instance metadata.
  - name: manager-auth
    description: >-
      Manager session lifecycle. Every manager has a named account (username
      + password, all with role admin); the password is sent to managerLogin
      ONLY, and every other manager operation authenticates with the opaque
      bearer token it returns (10-minute idle expiry, sliding). The bearer
      identity carries the username. Every authenticated response carries the
      refreshed expiry in the GXP-Token-Expires header (ISO-8601 instant) so
      a client can warn before idle-out. One interface is generated per
      manager-* tag so each BCE package keeps its own Boundary.
  - name: manager-users
    description: >-
      Manager account administration (auth-hardening A2). Every account has
      role admin; any admin may create, deactivate, reactivate, reset the
      password and reset the second factor of any other account, but never
      deactivate their own (the one guard that keeps a box from having zero
      active admins) nor reset their own password or factor without the
      current password (the /me operations). Second-factor self-service
      (auth-hardening A3) lives under /me: enroll, confirm, disable,
      regenerate recovery codes. No response ever carries password material
      or the secret, except the one-time enrollment and recovery-code
      responses. Deactivation and every reset drop that user's bearer tokens
      on the next request. One Boundary (UserResource) over the de.gxp.user
      Control.
  - name: manager-audit
    description: >-
      The append-only audit trail (auth-hardening A4). Every manager
      mutation, every login outcome and every account / second-factor
      action is recorded with who, when, the attributed client address,
      whether it came through the trusted proxy, the action, the entity,
      the entity id and — for updates — the NAME of each changed field.
      Never a value: the table has no value column at all. Read only —
      there is no update or delete operation; retention (365 days) is the
      only deletion. One Boundary (AuditResource) over the de.gxp.audit
      Control.
  - name: manager-updates
    description: >-
      The update channel (remote-operations Part C). The box polls a static
      manifest + detached Ed25519 signature outbound only, verifies it with
      the public key shipped inside the image, and hands a verified request
      to the host-side updater through a shared volume. Managers see the
      state, switch automatic updates on/off, choose the daily apply time
      (property-local), trigger a check and apply an available update now.
      No operation ever carries manifest bytes, signatures or key material.
      One Boundary (UpdateResource) over the de.gxp.update Control.
  - name: manager-property
    description: >-
      The single property (invariant 4 — exactly one row, no create/delete).
      Template fields (greeting, standby) are stored and returned RAW; the
      manager edits templates, not resolved text.
  - name: manager-rooms
    description: Rooms of the property, with per-room overrides.
  - name: manager-menu
    description: >-
      Menu catalogue (read-only, Flyway-seeded — deliberately no write
      operation), per-scope menu configuration (per-field inheritance room →
      property → catalogue default) and per-scope action cards (whole-set
      replace, 0–4). The structurally fixed settings entry (einstellungen) is
      NOT part of the catalogue — it is app chrome a manager must not disable.
  - name: manager-stays
    description: Stays; "active" is derived from the clock, never stored.
  - name: manager-assets
    description: >-
      Binary assets (PNG/JPEG only, content-verified, 10 MiB cap, server-side
      downscaled to 2560 px longest edge), stored in PostgreSQL.
  - name: pairing
    description: >-
      Kiosk-facing pairing surface — unauthenticated by design. A kiosk
      creates a short-lived pairing request and receives a human-readable
      display code (shown to the manager) plus a high-entropy poll secret
      (kept by the kiosk, never displayed): the display code alone never
      suffices to obtain a token, because the kiosk screen stands in a
      guest-accessible room. Also serves the instance CA certificate for
      kiosk provisioning. Second Boundary of the de.gxp.device package
      (one consistency unit spanning two auth surfaces).
  - name: manager-devices
    description: >-
      Manager-facing device administration — confirm pairing requests, list,
      rename and revoke paired kiosk devices. No operation ever returns
      token material. Shares the de.gxp.device package (and its single
      Control) with the pairing tag.
  - name: guest
    description: >-
      Kiosk-facing guest read model (device bearer token). The room is
      derived EXCLUSIVELY from the authenticated device identity — no guest
      operation accepts any room, stay, device or property identifier, in
      path, query, header or body. Localized fields are language-keyed maps
      over exactly the property's offered languages, so a kiosk language
      switch fetches nothing. Every JSON response carries a strong ETag and
      answers 304 on If-None-Match — steady-state polling is 304s.
paths:
  /api/system/health:
    get:
      tags: [system]
      operationId: getSystemHealth
      summary: Liveness — answers whenever the process serves HTTP
      description: Static response, touches no database.
      responses:
        "200":
          description: The process is up and serving HTTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
  /api/system/ready:
    get:
      tags: [system]
      operationId: getSystemReadiness
      summary: Readiness — verifies database connectivity
      responses:
        "200":
          description: The instance is ready; the database answered a probe query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReadiness"
        "503":
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Instance metadata
      description: >-
        Returns instance metadata; instanceName is read from PostgreSQL
        through the full BCE stack (Flyway-seeded row). Restricted to
        authenticated callers (admin or device token) — version
        fingerprinting on an unpatchable box is not offered anonymously
        (decided 2026-08-19).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/login:
    post:
      tags: [manager-auth]
      operationId: managerLogin
      summary: Log in with username and password
      description: >-
        The only operation that ever sees the password. Success returns an
        opaque 256-bit bearer token with a sliding 10-minute idle expiry and
        the username it was issued for. Failure is a deliberately generic 401
        (no oracle): an unknown username, a deactivated user and a wrong
        password answer the same body and cost the same work. Failed attempts are
        budgeted per attributed source address (5 per 15 minutes, escalating
        block from 60 s up to 15 minutes): an exhausted address is answered
        429 with Retry-After before any password work, every other address is
        unaffected, and no account is ever locked. Second factor (auth-hardening
        A3): a login arriving through the configured trusted proxy MUST carry
        totpCode or recoveryCode — without one it is answered 401
        `second-factor-required` BEFORE the password is looked at (nothing is
        verified, nothing is counted). With one, password and code are verified
        together and every failure — wrong password, wrong or replayed code,
        spent recovery code, or an account without a confirmed factor — is the
        same generic 401 `invalid-credentials` and counts against the address.
        On the LAN the factor is never asked and both fields are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; token is in-memory only on the client.
          headers:
            GXP-Token-Expires:
              $ref: "#/components/headers/GXPTokenExpires"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: >-
            Either `second-factor-required` (via the trusted proxy, no code
            supplied; the password was not verified) or `invalid-credentials`
            (unknown user, deactivated user, wrong password, wrong/replayed/spent
            code, or no confirmed factor via the proxy) — deliberately generic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: >-
            This address has exhausted its login budget (code
            `too-many-attempts`); retry after the number of seconds in
            Retry-After. Other addresses are unaffected.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/logout:
    post:
      tags: [manager-auth]
      operationId: managerLogout
      summary: Invalidate the presented bearer token immediately
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Token dropped server-side.
        "401":
          description: Missing, unknown or expired token.
  /api/manager/password:
    put:
      tags: [manager-auth]
      operationId: changeManagerPassword
      summary: Change the caller's own password
      description: >-
        Verifies the caller's current password, enforces the minimal policy
        (at least 8 characters), stores the new hash and immediately drops
        the caller's active bearer tokens — including the one presented.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password changed; the caller's bearer tokens are dropped.
        "400":
          description: Current password mismatch or policy violation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "429":
          description: >-
            The caller's address has exhausted its login budget (the
            current-password check shares it; code `too-many-attempts`).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users:
    get:
      tags: [manager-users]
      operationId: listUsers
      summary: List every manager account
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Every account, active or not, ordered by id. Never any hash or secret.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDto"
        "401":
          description: Missing, unknown or expired token.
    post:
      tags: [manager-users]
      operationId: createUser
      summary: Create a manager account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Created and active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDto"
        "400":
          description: Validation failure (username pattern, password shorter than 8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: The username is taken (code `username-taken`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users/{userId}/deactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [manager-users]
      operationId: deactivateUser
      summary: Deactivate an account — its tokens are dead on the next request
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deactivated (idempotent).
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such account (code `user-not-found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The caller's own account (code `cannot-deactivate-self`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users/{userId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [manager-users]
      operationId: reactivateUser
      summary: Reactivate a deactivated account
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Active again (idempotent).
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such account (code `user-not-found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [manager-users]
      operationId: resetUserPassword
      summary: Set another account's password (admin reset) — its tokens are dropped
      description: >-
        Replaces another account's password without knowing the old one and
        drops that user's bearer tokens. The caller's OWN account is refused
        (code `cannot-reset-self`): an own change goes through
        changeManagerPassword, which requires the current password.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Password replaced; that user's bearer tokens are dropped.
        "400":
          description: Policy violation (shorter than 8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such account (code `user-not-found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The caller's own account (code `cannot-reset-self`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users/{userId}/second-factor:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [manager-users]
      operationId: resetUserSecondFactor
      summary: Remove another account's second factor (admin reset) — its tokens are dropped
      description: >-
        The documented recovery route (auth-hardening REQ-618): a colleague
        on the LAN clears the lost factor and its recovery codes; the user
        then enrolls again on the LAN. The caller's OWN factor is refused
        (code `cannot-reset-self`) — that path is DELETE
        /api/manager/users/me/second-factor with the current password.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Factor and recovery codes removed (idempotent); that user's bearer tokens are dropped.
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such account (code `user-not-found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The caller's own account (code `cannot-reset-self`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users/me/second-factor:
    get:
      tags: [manager-users]
      operationId: getOwnSecondFactor
      summary: The caller's second-factor state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: State and remaining recovery codes — never the secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorStatusDto"
        "401":
          description: Missing, unknown or expired token.
    post:
      tags: [manager-users]
      operationId: enrollOwnSecondFactor
      summary: Start enrolling a second factor (TOTP)
      description: >-
        Generates a PENDING secret and returns it exactly once, as base32 and
        as an otpauth:// URI (render the QR client-side; the backend never
        does). Calling it again while pending replaces the secret. The factor
        is not required for anything until confirmOwnSecondFactor succeeds.
        Refused while a confirmed factor exists — disable it first.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The one-time enrollment material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorEnrollmentDto"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: A confirmed factor exists (code `second-factor-already-confirmed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [manager-users]
      operationId: disableOwnSecondFactor
      summary: Remove the caller's second factor — requires the current password
      description: >-
        Clears the secret (pending or confirmed) and every recovery code. The
        current password is required so an idle-but-open session cannot strip
        the factor. Idempotent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "204":
          description: No factor enrolled any more.
        "400":
          description: Current password mismatch (code `current-password-mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/users/me/second-factor/confirm:
    post:
      tags: [manager-users]
      operationId: confirmOwnSecondFactor
      summary: Confirm the pending enrollment with one code — returns the recovery codes
      description: >-
        One valid TOTP code turns the pending secret into a confirmed factor
        and returns the first batch of 10 single-use recovery codes, shown
        exactly once (stored hashed). From then on every login through the
        trusted proxy requires a code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorCodeRequest"
      responses:
        "200":
          description: Confirmed; these recovery codes are shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesDto"
        "400":
          description: The code did not verify (code `invalid-code`) or failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: Nothing is pending — enroll first (code `no-pending-enrollment`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/users/me/recovery-codes:
    post:
      tags: [manager-users]
      operationId: regenerateOwnRecoveryCodes
      summary: Replace the caller's recovery codes — requires the current password
      description: >-
        Invalidates every previous code and returns a fresh batch of 10,
        shown exactly once. Only with a confirmed factor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "200":
          description: The new batch; the old one no longer works.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesDto"
        "400":
          description: Current password mismatch (code `current-password-mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: No confirmed factor (code `second-factor-not-confirmed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/audit:
    get:
      tags: [manager-audit]
      operationId: listAuditEntries
      summary: Page through the audit trail, newest first
      description: >-
        Entries ordered by occurredAt descending (then id descending), with
        the total count. Page size 1–200, default 50.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of entries plus the total.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPageDto"
        "400":
          description: Validation failure (size outside 1–200, negative page).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/updates:
    get:
      tags: [manager-updates]
      operationId: getUpdateStatus
      summary: Update channel status
      description: >-
        Configuration, the last check outcome, the available update (if any,
        also while automatic updates are disabled), when it is scheduled and
        the host-side updater's last reported state.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatusDto"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/updates/settings:
    put:
      tags: [manager-updates]
      operationId: updateUpdateSettings
      summary: Switch automatic updates and set the daily apply time
      description: >-
        applyAt is HH:MM in the property's timezone. Audited (one row per
        changed field). The desired-update file is reconciled immediately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Settings stored; the new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatusDto"
        "400":
          description: Validation failure (applyAt not HH:MM).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/updates/apply:
    post:
      tags: [manager-updates]
      operationId: applyUpdateNow
      summary: Apply the available update at the next updater run
      description: >-
        Requests the available update now instead of at the apply time.
        The updater (a host timer, every 5 minutes) performs it; the box
        restarts once. Audited.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Request recorded; the status with the new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatusDto"
        "401":
          description: Missing, unknown or expired token.
        "409":
          description: No verified update is available (code `no-update-available`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/updates/check:
    post:
      tags: [manager-updates]
      operationId: checkForUpdateNow
      summary: Check the update server now
      description: >-
        Runs one check synchronously (at most ~15 s) and returns the
        resulting status. A check already running is not duplicated.
        Audited.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The status after the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatusDto"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/property:
    get:
      tags: [manager-property]
      operationId: getProperty
      summary: Read the single property (settings options and raw templates included)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDto"
        "401":
          description: Missing, unknown or expired token.
    put:
      tags: [manager-property]
      operationId: updateProperty
      summary: Replace the single property
      description: >-
        Validates the IANA timezone, hex brand colors, defaults contained in
        their offered sets, language codes (de/en in v1), referenced asset
        kinds and every template field against its allowed placeholder set.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyDto"
      responses:
        "200":
          description: The stored property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDto"
        "400":
          description: Validation failure (timezone, colors, options, templates).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
  /api/manager/rooms:
    get:
      tags: [manager-rooms]
      operationId: listRooms
      summary: List rooms
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All rooms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomDto"
        "401":
          description: Missing, unknown or expired token.
    post:
      tags: [manager-rooms]
      operationId: createRoom
      summary: Create a room
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
