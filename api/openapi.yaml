        "401":
          description: Missing, unknown or expired token.
        "404":
          description: No such asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Referenced by the property or a room — the referrer is named.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pairing/requests:
    post:
      tags: [pairing]
      operationId: createPairingRequest
      summary: Create a short-lived pairing request (kiosk, unauthenticated)
      description: >-
        Returns the display code the kiosk shows to the manager, the poll
        secret the kiosk keeps (never displayed), and the expiry. Expired
        requests are cleaned up opportunistically on each create.
        Deliberately not throttled (owner decision 2026-08-24): no rate limit
        and no admission gate, so there is no 429 here — the number of live
        requests is bounded only in age, by the 10-minute TTL plus that
        opportunistic cleanup, and guessing is made infeasible by the code
        entropy and TTL rather than by a budget.
      responses:
        "201":
          description: Pairing request created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingRequestCreated"
  /api/pairing/requests/{code}:
    get:
      tags: [pairing]
      operationId: pollPairingRequest
      summary: Poll a pairing request (kiosk, unauthenticated, poll secret required)
      description: >-
        202 while pending; 200 with the device token EXACTLY ONCE after the
        manager confirms — the request is atomically claimed, a second poll
        gets 404. Unknown, expired, already-claimed and wrong-secret
        requests all answer one indistinguishable 404 (no oracle).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: GXP-Pairing-Secret
          in: header
          required: true
          description: The poll secret returned at create — never displayed on the kiosk.
          schema:
            type: string
      responses:
        "200":
          description: >-
            Confirmed and claimed by THIS poll — the raw device token,
            returned exactly once and never stored raw server-side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCompleted"
        "202":
          description: Pending — the manager has not confirmed yet. Empty body.
        "404":
          description: >-
            Unknown, expired, claimed or wrong secret — deliberately
            indistinguishable (status and body identical).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pairing/ca:
    get:
      tags: [pairing]
      operationId: getPairingCa
      summary: The instance CA certificate (PEM — public material)
      description: >-
        For kiosk provisioning: a person installs this CA into the device's
        OS/browser trust store during pairing (documented in the README as a
        human step). Public material, unauthenticated.
      responses:
        "200":
          description: The CA certificate, PEM-encoded.
          content:
            application/x-pem-file:
              schema:
                type: string
        "404":
          description: No TLS material on this instance (dev/test profiles).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/manager/pairings/{code}/confirm:
    post:
      tags: [manager-devices]
      operationId: confirmPairing
      summary: Confirm a pairing request to a room (manager)
      description: >-
        Assigns the pending request to an existing room, with an optional
        device name (default derived from the room code). The kiosk's next
        poll then claims the token.
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPairingRequest"
      responses:
        "204":
          description: Confirmed.
        "400":
          description: Unknown room.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "404":
          description: Unknown or expired pairing code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
