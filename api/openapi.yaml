          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/guest/content:
    get:
      tags: [guest]
      operationId: getGuestContent
      summary: Everything the device's room renders from, in one document
      description: >-
        Property (name, brand, logo), room, occupancy, settings config with
        resolved defaults (room override, else property default), the stay's
        raw preference override (occupied only), the resolved menu under the
        ceiling rule plus the fixed settings chrome, the resolved standby
        texts, and — for an occupied room — the home content (headline/
        subtitle/paragraph and 0-4 action cards, all templates RESOLVED
        server-side per offered language against the active stay; no braces
        ever leave the server, artwork falls back room -> property). Vacant
        rooms serve no stay-derived value (data-sparing) but still answer 200
        — the standby screen renders from this.
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The content for the device's room.
          headers:
            ETag:
              description: >-
                Strong ETag — an opaque 64-hex version stamp for this room's
                content. Compared, never parsed.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestContent"
        "304":
          description: If-None-Match matched the current version stamp — empty body.
        "401":
          description: Missing, unknown or revoked device token.
  /api/guest/assets/{assetId}:
    get:
      tags: [guest]
      operationId: getGuestAsset
      summary: Read an asset reachable from the device's own resolved view
      description: >-
        Serves ONLY the property logo, the property default artwork and the
        own room's artwork; any other id — existing or not — is the same
        404 (no enumeration of stored assets from a guest device). Asset
        content per id is immutable, so clients may cache long.
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The stored bytes.
          headers:
            ETag:
              description: Strong ETag — the SHA-256 of the stored bytes.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: If-None-Match matched the stored SHA-256.
        "401":
          description: Missing, unknown or revoked device token.
        "404":
          description: Unknown or unreachable asset — deliberately the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/guest/preferences:
    put:
      tags: [guest]
      operationId: putGuestPreferences
      summary: Write the guest's preference override (whole record, stay-anchored)
      description: >-
        Mirrors the kiosk's StoredPreferences gateway record — a whole-record
        write, both fields nullable (null = follow the defaults). Lands on
        the ACTIVE stay, so it clears at stay change by construction. The
        kiosk treats failure as normal (fire-and-forget).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestPreferencesUpdate"
      responses:
        "204":
          description: Stored on the active stay.
        "400":
          description: A value is outside the property's offered set (value-not-offered).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or revoked device token.
        "409":
          description: The room is vacant (room-vacant) — there is no stay to write on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        One bearer authentication path, two token kinds. Manager tokens come
        from managerLogin (stored hashed in-memory, sliding 10-minute idle
        expiry; a restart logs everyone out). Device tokens come from the
        pairing flow (stored hashed in PostgreSQL, long-lived, no idle
        expiry, revocable — dead on the very next request after revocation).
        The token is identity AND authentication; a device's room is derived
        from it, never from a request parameter.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  headers:
    RetryAfter:
      description: Seconds until the address is admitted again (whole number).
      schema:
        type: integer
        format: int64
    GXPTokenExpires:
      description: >-
        Refreshed idle expiry of the presented (or issued) bearer token,
        ISO-8601 instant. Present on every authenticated response.
      schema:
        type: string
        format: date-time
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Unique, lower-case account name.
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        password:
          type: string
          minLength: 1
        totpCode:
          type: string
          description: Current 6-digit TOTP code — required via the trusted proxy, ignored on the LAN.
          pattern: "^[0-9]{6}$"
        recoveryCode:
          type: string
          description: A single-use recovery code in place of totpCode — required via the trusted proxy, ignored on the LAN.
          pattern: "^[a-z0-9]{10}$"
    LoginResponse:
      type: object
      required: [token, username, idleTimeoutSeconds, expiresAt]
      properties:
        token:
          type: string
          description: Opaque bearer token — keep in memory only.
        username:
          type: string
          description: The account the token was issued for.
        idleTimeoutSeconds:
          type: integer
          format: int64
        expiresAt:
          type: string
          format: date-time
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
    UserDto:
      type: object
      description: A manager account. Never carries password material or the second-factor secret.
      required: [id, username, active, secondFactorState, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        active:
          type: boolean
        secondFactorState:
          $ref: "#/components/schemas/SecondFactorState"
        createdAt:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Unique, lower-case account name.
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        password:
          type: string
          description: Initial password, at least 8 characters.
          minLength: 8
    PasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
    SecondFactorState:
      type: string
      description: none = not enrolled; pending = secret issued, not yet confirmed; confirmed = required via the trusted proxy.
      enum: [none, pending, confirmed]
    SecondFactorStatusDto:
      type: object
      required: [state, recoveryCodesRemaining]
      properties:
        state:
          $ref: "#/components/schemas/SecondFactorState"
        recoveryCodesRemaining:
          type: integer
          format: int32
          description: Unspent recovery codes (0 unless confirmed).
    SecondFactorEnrollmentDto:
      type: object
      description: Shown exactly once — the only response that ever carries the secret.
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: The shared secret, base32 (RFC 4648), for manual entry.
        otpauthUri:
          type: string
          description: otpauth://totp/GXP:<username>?secret=…&issuer=GXP&algorithm=SHA1&digits=6&period=30
    SecondFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A current 6-digit TOTP code.
          pattern: "^[0-9]{6}$"
    PasswordConfirmationRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: The caller's current password.
          minLength: 1
    RecoveryCodesDto:
      type: object
      description: Shown exactly once; stored hashed.
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z0-9]{10}$"
    LanguageCode:
      type: string
      description: v1 supports exactly the kiosk's compiled catalogues.
      enum: [de, en]
    AppearanceMode:
      type: string
      enum: [light, dark, system]
    LocalizedText:
      type: object
      description: Language-keyed map (keys are LanguageCode values).
      additionalProperties:
        type: string
    LanguageOptionDto:
      type: object
      required: [code, shortLabel, label, locale]
      properties:
        code:
          $ref: "#/components/schemas/LanguageCode"
        shortLabel:
          type: string
          minLength: 1
        label:
          type: string
          description: Endonym — never translated.
          minLength: 1
        locale:
          type: string
          description: BCP-47 tag governing time/date formatting (e.g. de-DE, en-GB).
          minLength: 1
    AppearanceOptionDto:
      type: object
      required: [mode, icon]
      properties:
        mode:
          $ref: "#/components/schemas/AppearanceMode"
        icon:
          type: string
          minLength: 1
    PropertyDto:
      type: object
      required:
        - name
        - mainLanguage
        - timezone
        - brandPrimary
        - brandPrimaryDeep
        - brandSecondary
        - defaultAppearance
        - languages
        - appearances
        - heroSubtitle
        - headline
        - paragraph
        - standbyHeadline
        - standbyMessage
      properties:
        name:
          type: string
          minLength: 1
        mainLanguage:
          $ref: "#/components/schemas/LanguageCode"
        timezone:
          type: string
          description: IANA zone id — ZoneId-validated server-side.
          minLength: 1
        brandPrimary:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        brandPrimaryDeep:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        brandSecondary:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        defaultAppearance:
          $ref: "#/components/schemas/AppearanceMode"
        logoAssetId:
          type: integer
          format: int64
          description: Optional; the referenced asset must be kind LOGO.
        artworkAssetId:
          type: integer
          format: int64
          description: Optional house default; must be kind ARTWORK.
        languages:
          type: array
          description: Offered languages, in display order; must contain mainLanguage.
          minItems: 1
          items:
            $ref: "#/components/schemas/LanguageOptionDto"
        appearances:
          type: array
          description: Offered appearance options, in display order; must contain defaultAppearance.
          minItems: 1
          items:
            $ref: "#/components/schemas/AppearanceOptionDto"
        heroSubtitle:
          $ref: "#/components/schemas/LocalizedText"
        headline:
          description: Greeting template — all four placeholders allowed. Raw.
          $ref: "#/components/schemas/LocalizedText"
        paragraph:
          $ref: "#/components/schemas/LocalizedText"
        standbyHeadline:
          description: Standby template — only {property.name} (no stay when vacant). Raw.
          $ref: "#/components/schemas/LocalizedText"
        standbyMessage:
          $ref: "#/components/schemas/LocalizedText"
    StayStatus:
      type: string
      description: Stored state; "active" is derived (BOOKED and check-in ≤ now < check-out).
      enum: [BOOKED, CANCELLED]
    StayDto:
      type: object
      required: [roomId, displayName, checkIn, checkOut, status]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        roomId:
          type: integer
          format: int64
        displayName:
          type: string
          minLength: 1
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        language:
          $ref: "#/components/schemas/LanguageCode"
        appearance:
          $ref: "#/components/schemas/AppearanceMode"
        status:
          $ref: "#/components/schemas/StayStatus"
    AssetKind:
      type: string
      enum: [LOGO, ARTWORK]
    AssetMetadataDto:
      type: object
      required: [id, mimeType, byteSize, width, height, sha256, kind]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        mimeType:
          type: string
          enum: [image/png, image/jpeg]
        byteSize:
          type: integer
        width:
          type: integer
        height:
          type: integer
        sha256:
          type: string
          description: Hex SHA-256 of the stored bytes — doubles as the strong ETag.
        kind:
          $ref: "#/components/schemas/AssetKind"
    MenuItemDefinitionDto:
      type: object
      required: [key, route, defaultIcon, defaultSortIndex, label, introducedRelease]
      properties:
        key:
          type: string
        route:
          type: string
          description: Kiosk route; the home section's route is the empty string.
        defaultIcon:
          type: string
        defaultSortIndex:
          type: integer
        label:
          $ref: "#/components/schemas/LocalizedText"
        introducedRelease:
          type: string
    MenuItemConfigEntryDto:
      type: object
      description: >-
        One scope's override entry for a catalogue item. Every field except
        menuItemKey is optional — an absent field inherits per-field
        (room → property → catalogue default).
      required: [menuItemKey]
      properties:
        menuItemKey:
          type: string
        enabled:
          type: boolean
        sortIndex:
          type: integer
        iconOverride:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
    ActionCardDto:
      type: object
      required: [sortIndex, icon, targetMenuItemKey, title, description]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        sortIndex:
          type: integer
          minimum: 0
          maximum: 3
        icon:
          type: string
          minLength: 1
        targetMenuItemKey:
          type: string
          description: >-
            Must exist in the catalogue and be enabled in this card's scope.
            Deliberately not unique — several cards may target the same item.
        title:
          description: Raw title template per language.
          $ref: "#/components/schemas/LocalizedText"
        description:
          description: Raw description template per language.
          $ref: "#/components/schemas/LocalizedText"
    RoomDto:
      type: object
      required: [code, displayName]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        code:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        artworkAssetId:
          type: integer
          format: int64
          description: Optional override; must be kind ARTWORK.
        defaultLanguage:
          $ref: "#/components/schemas/LanguageCode"
        defaultAppearance:
          $ref: "#/components/schemas/AppearanceMode"
    SystemHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    SystemReadiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [READY]
    SystemInfo:
      type: object
      required: [instanceName, applicationVersion]
      properties:
        instanceName:
          type: string
        applicationVersion:
          type: string
    AuditEntryDto:
      type: object
      description: >-
        One audit row. Carries the NAME of a changed field, never a value
        (constitution principle 3).
      required: [id, occurredAt, address, viaProxy, action, entity]
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
          description: Principal username; absent when nobody was authenticated (a failed login).
        address:
          type: string
          description: Attributed client address (socket peer, or the trusted proxy's forwarded address).
        viaProxy:
          type: boolean
        action:
          type: string
          description: >-
            login-success, login-failure, second-factor-required, create,
            update, delete, replace, confirm, rename, revoke, user-create,
            user-deactivate, user-reactivate, password-reset,
            password-change, second-factor-reset, second-factor-enroll,
            second-factor-confirm, second-factor-disable,
            recovery-codes-regenerate.
        entity:
          type: string
          description: user, property, room, stay, asset, menu-config, action-cards, device.
        entityId:
          type: string
          description: The entity's id, the username, or "property" for a property-scope menu/card replace.
        field:
          type: string
          description: Name of the changed field (update rows only).
    AuditPageDto:
      type: object
      required: [entries, page, size, total]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryDto"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    UpdateCheckOutcome:
      type: string
      description: >-
        Outcome of the last manifest check. never-checked = no check since
        install; not-configured = no base URL; insecure-base-url = plain
        http outside a test profile; unreachable / http-error / too-large =
        the fetch failed; invalid-signature / malformed / wrong-schema-version
        / wrong-channel = the manifest was rejected; no-update = a valid
        manifest at or below the running version; minimum-from-version-not-met
        = the running version is too old for the offered one;
        update-available = a verified, newer manifest is stored.
      enum: [never-checked, not-configured, insecure-base-url, unreachable, http-error, too-large,
             invalid-signature, malformed, wrong-schema-version, wrong-channel, no-update,
             minimum-from-version-not-met, update-available]
    AvailableUpdateDto:
      type: object
      required: [version, publishedAt, artifactRef]
      properties:
        version:
          type: string
        publishedAt:
          type: string
          format: date-time
        artifactRef:
          type: string
          description: The image reference the updater will pull.
    UpdaterStateDto:
      description: >-
        The host-side updater's last reported state. outcome and message are
        free strings on purpose — a newer updater may report a code this
        application version does not know, and the status must still render.
      type: object
      required: [updatedAt, outcome, rolledBack, currentImage]
      properties:
        updatedAt:
          type: string
          format: date-time
        lastAttemptAt:
          type: string
          format: date-time
        attemptedVersion:
          type: string
        outcome:
          type: string
        rolledBack:
          type: boolean
        currentImage:
          type: string
        currentVersion:
          type: string
        previousImage:
          type: string
        backupFile:
          type: string
        message:
          type: string
    UpdateStatusDto:
      type: object
      required: [currentVersion, channel, configured, autoUpdateEnabled, applyAt, timezone, lastCheckOutcome]
      properties:
        currentVersion:
          type: string
          description: The running application version, e.g. 1.0.0-SNAPSHOT.
        channel:
          type: string
        configured:
          type: boolean
          description: Whether an update base URL is set.
        autoUpdateEnabled:
          type: boolean
        applyAt:
          type: string
          description: Daily apply time, HH:MM in the property's timezone.
        timezone:
          type: string
          description: The property's IANA timezone.
        lastCheckAt:
          type: string
          format: date-time
        lastCheckOutcome:
          $ref: "#/components/schemas/UpdateCheckOutcome"
        available:
          $ref: "#/components/schemas/AvailableUpdateDto"
        scheduledFor:
          type: string
          format: date-time
          description: applyNotBefore of the current desired-update file, if one exists.
        updater:
          $ref: "#/components/schemas/UpdaterStateDto"
    UpdateSettingsRequest:
      type: object
      required: [autoUpdateEnabled, applyAt]
      properties:
        autoUpdateEnabled:
          type: boolean
        applyAt:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: HH:MM in the property's timezone.
    ApiError:
      description: >-
        Shared error shape. code is machine-usable (e.g.
        menu-item-targeted-by-cards, stay-overlap, asset-in-use,
        unknown-placeholder); details carries one entry per offending
        item where a list is needed. Extended additively only.
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorDetail"
    PairingRequestCreated:
      type: object
      required: [code, pollSecret, expiresAt]
      properties:
        code:
          type: string
          description: >-
            8-char display code (unambiguous alphabet, no 0/O/1/I) — shown on
            the kiosk for the manager. Alone it never yields a token.
        pollSecret:
          type: string
          description: >-
            High-entropy poll secret — kept by the kiosk, never displayed,
            presented via the GXP-Pairing-Secret header on every poll.
            Stored hashed server-side.
        expiresAt:
          type: string
          format: date-time
    PairingCompleted:
      type: object
      required: [deviceToken, deviceName, roomCode]
      properties:
        deviceToken:
          type: string
          description: >-
            The opaque device bearer token — returned exactly once, persisted
            only as a SHA-256 hash server-side. The kiosk stores it as its
            own credential.
        deviceName:
          type: string
        roomCode:
          type: string
    ConfirmPairingRequest:
      type: object
      required: [roomId]
      properties:
        roomId:
          type: integer
          format: int64
        deviceName:
          type: string
          minLength: 1
          description: Optional; defaults to "Kiosk <room code>".
    DeviceDto:
      type: object
      description: Never carries token material — not even the hash.
      required: [id, name, roomId, roomCode, createdAt]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        roomId:
          type: integer
          format: int64
        roomCode:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Throttled — accurate to about a minute.
        revokedAt:
          type: string
          format: date-time
    DeviceUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    OccupancyState:
      type: string
      description: Derived — BOOKED and check-in ≤ now < check-out is OCCUPIED.
      enum: [OCCUPIED, VACANT]
    GuestBrand:
      type: object
      required: [primary, primaryDeep, secondary]
      properties:
        primary:
          type: string
        primaryDeep:
          type: string
        secondary:
          type: string
    GuestProperty:
      type: object
      required: [name, brand]
      properties:
        name:
          type: string
        brand:
          $ref: "#/components/schemas/GuestBrand"
        logoAssetId:
          type: integer
          format: int64
          description: Fetch via getGuestAsset (with the device token — no bare img src).
    GuestRoom:
      type: object
      required: [code, displayName]
      properties:
        code:
          type: string
        displayName:
          type: string
    GuestSettings:
      type: object
      description: The kiosk's settingsConfig plus resolved defaults (room override, else property).
      required: [languages, appearances, defaultLanguage, defaultAppearance]
      properties:
        languages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LanguageOptionDto"
        appearances:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AppearanceOptionDto"
        defaultLanguage:
          $ref: "#/components/schemas/LanguageCode"
        defaultAppearance:
          $ref: "#/components/schemas/AppearanceMode"
    GuestPreference:
      type: object
      description: >-
        The stay's RAW preference override (default-⊕-choice model: the kiosk
        keeps its own resolution). Fields absent = no override.
      properties:
        language:
          type: string
        appearance:
          type: string
    GuestMenuItem:
      type: object
      required: [key, label, icon, route, sortIndex]
      properties:
        key:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
        route:
          type: string
        sortIndex:
          type: integer
    GuestSettingsEntry:
      type: object
      description: Fixed app chrome — NOT a catalogue item, no configuration removes it.
      required: [id, label, icon, route]
      properties:
        id:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
        route:
          type: string
    GuestMenu:
      type: object
      required: [items, settingsEntry]
      properties:
        items:
          type: array
          description: Resolved-enabled items only, ordered by resolved sort index.
          maxItems: 50
          items:
            $ref: "#/components/schemas/GuestMenuItem"
        settingsEntry:
          $ref: "#/components/schemas/GuestSettingsEntry"
    GuestStandby:
      type: object
      description: Standby texts, template-resolved per offered language.
      required: [headline, message]
      properties:
        headline:
          $ref: "#/components/schemas/LocalizedText"
        message:
          $ref: "#/components/schemas/LocalizedText"
    GuestContent:
      type: object
      required: [property, room, occupancy, settings, menu, standby]
      properties:
        property:
          $ref: "#/components/schemas/GuestProperty"
        room:
          $ref: "#/components/schemas/GuestRoom"
        occupancy:
          $ref: "#/components/schemas/OccupancyState"
        guestDisplayName:
          type: string
          description: Occupied only — a vacant room serves no stay-derived value.
        settings:
          $ref: "#/components/schemas/GuestSettings"
        preference:
          $ref: "#/components/schemas/GuestPreference"
        menu:
          $ref: "#/components/schemas/GuestMenu"
        standby:
          $ref: "#/components/schemas/GuestStandby"
        home:
          description: Occupied only — a vacant room serves no stay-derived value.
          $ref: "#/components/schemas/GuestHome"
    GuestActionCard:
      type: object
      required: [icon, title, description, targetKey, targetRoute]
      properties:
        icon:
          type: string
        title:
          description: RESOLVED per offered language — never a raw template.
          $ref: "#/components/schemas/LocalizedText"
        description:
          description: RESOLVED per offered language — never a raw template.
          $ref: "#/components/schemas/LocalizedText"
        targetKey:
          type: string
        targetRoute:
          type: string
    GuestHome:
      type: object
      required: [headline, subtitle, paragraph, actionCards]
      properties:
        headline:
          description: RESOLVED greeting per offered language.
          $ref: "#/components/schemas/LocalizedText"
        subtitle:
          $ref: "#/components/schemas/LocalizedText"
        paragraph:
          $ref: "#/components/schemas/LocalizedText"
        artworkAssetId:
          type: integer
          format: int64
          description: Room override, else the property default; absent when neither is set.
        actionCards:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/GuestActionCard"
    GuestPreferencesUpdate:
      type: object
      description: >-
        Whole-record write mirroring the kiosk's StoredPreferences — an
        absent/null field means "follow the defaults".
      properties:
        language:
          type: string
        appearance:
          type: string
    ApiErrorDetail:
      description: One offending item of a rejected request.
      type: object
      required: [message]
      properties:
        code:
          type: string
        message:
          type: string
        scope:
          type: string
          description: Affected scope — "property" or "room:{id}".
        reference:
          type: string
          description: Machine-usable reference (card id, key, stay id, …).
