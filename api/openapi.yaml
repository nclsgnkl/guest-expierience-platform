          description: Missing, unknown or expired token.
    post:
      tags: [manager-assets]
      operationId: uploadAsset
      summary: Upload an image as a raw binary body (no multipart)
      description: >-
        PNG or JPEG only; the declared content type must match the decoded
        format. Images over 2560 px longest edge are downscaled server-side;
        sha256/size/dimensions describe the STORED bytes.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AssetKind"
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored; metadata reflects the stored (possibly downscaled) bytes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetMetadataDto"
        "400":
          description: Undecodable body or declared type does not match the content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing, unknown or expired token.
        "413":
          description: Larger than the 10 MiB cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
